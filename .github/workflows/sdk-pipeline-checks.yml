name: Check SDK generation controls

on:
  pull_request:
    paths:
      - pipeline/**
      - fern/**
      - 2020-09-14.yml
      - .github/**
  push:
    branches: [master]
    paths:
      - pipeline/**
      - fern/**
      - 2020-09-14.yml
      - .github/**

permissions:
  contents: read

jobs:
  policy:
    if: github.repository == 'plaid/plaid-openapi' && github.event.repository.private == false && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: '1.26.9'
          cache: false
      - name: Install the pinned public legacy spec parser
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk-python"
          "$RUNNER_TEMP/sdk-python/bin/python" -m pip install --require-hashes -r pipeline/legacy/requirements.txt
          echo "$RUNNER_TEMP/sdk-python/bin" >> "$GITHUB_PATH"
      - name: Validate generation policy and public legacy inputs
        run: |
          python3 -B -m unittest discover -s pipeline/generation -p 'test_*.py' -v
          python3 -B -m unittest discover -s pipeline/legacy -p 'test_*.py' -v
          go test pipeline/generation/harden_internal_tests.go pipeline/generation/harden_internal_tests_test.go
